name: ci

# Each Linux step runs one target of the top-level Makefile, so `make ci` runs the
# same commands locally (in a fresh clone; see the Makefile). The macOS and Windows
# jobs run plain go and pytest commands.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (gofmt, go vet incl. other platforms, staticcheck, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: astral-sh/setup-uv@v6
      - name: gofmt
        run: make ci-gofmt
      - name: go vet
        run: make ci-vet
      - name: staticcheck 2025.1.1
        run: make ci-staticcheck
      - name: vet and build without recvmmsg/sendmmsg (macOS, Windows, 32-bit Linux)
        run: make ci-cross
      - name: install (Python 3.13, with the bench group for bench/render.py)
        run: make ci-py-lint-install
      - name: ruff (client and bench)
        run: make ci-ruff
      - name: mypy (strict, python_version 3.11; client, tests and bench)
        run: make ci-mypy

  go:
    name: Go (race tests, fuzzing, benchmarks once)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: tests with the race detector
        run: make ci-race
      - name: short fuzzing of every decoder
        run: make ci-fuzz
      - name: benchmarks compile and run once
        run: make ci-bench

  go-other-os:
    name: Go tests on ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go vet ./...
      - name: tests
        run: go test ./...

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: unit and end-to-end tests (the e2e tests build and start the Go server).
          - { os: ubuntu-latest, python: "3.11", e2e: true }
          - { os: ubuntu-latest, python: "3.13", e2e: true }
          # macOS and Windows: unit tests.
          - { os: macos-latest, python: "3.11", e2e: false }
          - { os: windows-latest, python: "3.11", e2e: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.e2e
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: astral-sh/setup-uv@v6
      - name: install
        if: matrix.e2e
        run: make ci-py-install PYTHON=${{ matrix.python }}
      - name: pytest (unit and end-to-end)
        if: matrix.e2e
        run: make ci-pytest
      - name: install
        if: ${{ !matrix.e2e }}
        working-directory: client
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: pytest (unit)
        if: ${{ !matrix.e2e }}
        working-directory: client
        run: uv run --frozen pytest -v -m "not e2e"

  docker:
    name: Server container image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make ci-docker-build
      - name: smoke test (flags after the image name are appended; HEALTHCHECK completes a hello)
        run: make ci-docker-smoke
